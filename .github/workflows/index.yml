name: Index de reconnaissance des cartes

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximum de cartes (0 = toutes)"
        required: false
        default: "0"
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi, pour les nouvelles extensions
  push:
    branches: [main]
    paths: ["vision/fp.js", "build/**", ".github/workflows/index.yml"]

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5 ml-matrix@6.12.1
      - run: node build/build-index.mjs --limit=${{ github.event.inputs.limit || 0 }}
      - name: Enregistrer l'index
        run: |
          git config user.name "cotecarte-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index
          if git diff --cached --quiet; then echo "Index inchangé"; exit 0; fi
          git commit -m "Index de reconnaissance mis à jour"
          git pull --rebase origin main
          git push
